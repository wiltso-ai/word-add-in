<!DOCTYPE html>
<html>

<head>
    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>

<body>
    <p>This add-in will insert the text 'Hello world!'.</p>
    <button id="helloButton">Say hello</button>
    <p id="selectionWarning" style="display: none; color: #b33; margin-top: 8px;">
        Please select some text in the document before running the add-in.
    </p>

    <!-- The following image URL tracks diagnostic data for this sample add-in. Please remove the image tag if you reuse this sample in your own code project. -->
    <img src="https://pnptelemetry.azurewebsites.net/pnp-officeaddins/samples/word-add-in-hello-world-run" />
</body>

<script>
    Office.onReady((info) => {
        // Check that we loaded into Word
        if (info.host === Office.HostType.Word) {
            document.getElementById("helloButton").onclick = sayHello;
        }
    });

    function sayHello() {
        const warningElement = document.getElementById("selectionWarning");
        warningElement.style.display = "none";

        return Word.run((context) => {
            const selection = context.document.getSelection();
            const selectionText = selection.getText();
            const selectionStart = selection.getRange(Word.RangeLocation.start);
            const selectionEnd = selection.getRange(Word.RangeLocation.end);
            const documentText = context.document.body.getText();

            selectionText.load("value");
            documentText.load("value");

            return context.sync().then(() => {
                if (!selectionText.value || !selectionText.value.trim()) {
                    warningElement.style.display = "block";
                    return;
                }

                const requestPayload = {
                    selectionText: selectionText.value,
                    selectionRangeLocation: {
                        start: selectionStart,
                        end: selectionEnd,
                    },
                    documentText: documentText.value,
                };

                // insert a paragraph at the start of the document.
                context.document.body.insertParagraph("Hello World", Word.InsertLocation.start);

                console.log("Prepared request payload", requestPayload);
                return context.sync();
            });
        });
    }
</script>

</html>
