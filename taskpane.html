<!DOCTYPE html>
<html>

<head>
    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-top: 12px;
        }

        textarea {
            width: 100%;
            min-height: 80px;
            margin-top: 6px;
        }

        .button-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .status {
            margin-top: 12px;
            font-size: 12px;
            color: #555;
        }

        .status.error {
            color: #b00020;
        }

        .supplemental {
            margin-top: 12px;
        }

        .supplemental textarea {
            min-height: 60px;
        }

        .comment-list {
            margin: 6px 0 0;
            padding-left: 18px;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <p>Ask a question about the selected text and preview the proposed replacement.</p>

    <label for="questionInput">Question</label>
    <textarea id="questionInput" placeholder="Ask a question about the selection..."></textarea>

    <div class="button-row">
        <button id="askButton">Ask</button>
        <button id="applyButton" disabled>Apply</button>
        <button id="cancelButton">Cancel</button>
    </div>

    <div class="supplemental">
        <label>
            <input type="checkbox" id="suggestCommentsToggle" checked />
            Suggest comments
        </label>
    </div>

    <label for="previewInput">Proposed replacement (editable)</label>
    <textarea id="previewInput" placeholder="Model response will appear here..."></textarea>

    <div class="supplemental">
        <label for="lawSummaryInput">Law summary</label>
        <textarea id="lawSummaryInput" placeholder="Optional law summary will appear here..." readonly></textarea>

        <label for="lawTextInput">Law text</label>
        <textarea id="lawTextInput" placeholder="Optional law text will appear here..." readonly></textarea>

        <label>Comments</label>
        <ul id="commentList" class="comment-list"></ul>
    </div>

    <div id="statusMessage" class="status"></div>

    <!-- The following image URL tracks diagnostic data for this sample add-in. Please remove the image tag if you reuse this sample in your own code project. -->
    <img src="https://pnptelemetry.azurewebsites.net/pnp-officeaddins/samples/word-add-in-hello-world-run" />
</body>

<script>
    const MODEL_API_URL = "https://your-api/assist";
    let lastComments = [];

    Office.onReady((info) => {
        if (info.host === Office.HostType.Word) {
            document.getElementById("askButton").onclick = askModel;
            document.getElementById("applyButton").onclick = applyReplacement;
            document.getElementById("cancelButton").onclick = resetPreview;
        }
    });

    function setStatus(message, isError = false) {
        const statusElement = document.getElementById("statusMessage");
        statusElement.textContent = message;
        statusElement.classList.toggle("error", isError);
    }

    async function getDocumentContext() {
        return Word.run(async (context) => {
            const selection = context.document.getSelection();
            const selectionText = selection.getText();
            const documentText = context.document.body.getText();
            await context.sync();

            return {
                selectionText: selectionText.value,
                documentText: documentText.value,
            };
        });
    }

    async function askModel() {
        const questionInput = document.getElementById("questionInput");
        const previewInput = document.getElementById("previewInput");
        const applyButton = document.getElementById("applyButton");
        const question = questionInput.value.trim();
        const lawSummaryInput = document.getElementById("lawSummaryInput");
        const lawTextInput = document.getElementById("lawTextInput");
        const commentList = document.getElementById("commentList");

        if (!question) {
            setStatus("Please enter a question before asking.", true);
            return;
        }

        setStatus("Reading selection and document...");
        applyButton.disabled = true;
        previewInput.value = "";
        lawSummaryInput.value = "";
        lawTextInput.value = "";
        commentList.innerHTML = "";

        try {
            const { selectionText, documentText } = await getDocumentContext();
            if (!selectionText) {
                setStatus("Select some text in the document before asking.", true);
                return;
            }
            setStatus("Contacting model...");

            const response = await fetch(MODEL_API_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    question,
                    selectionText,
                    documentText,
                }),
            });

            if (!response.ok) {
                throw new Error(`Model request failed with status ${response.status}`);
            }

            const data = await response.json();
            const replacementText = data.replacementText ?? "";
            const comments = Array.isArray(data.comments) ? data.comments : [];
            previewInput.value = replacementText;
            lawSummaryInput.value = data.lawSummary ?? "";
            lawTextInput.value = data.lawText ?? "";
            lastComments = comments;
            commentList.innerHTML = "";
            if (comments.length === 0) {
                const emptyItem = document.createElement("li");
                emptyItem.textContent = "No comments returned.";
                commentList.appendChild(emptyItem);
            } else {
                comments.forEach((comment) => {
                    const item = document.createElement("li");
                    const rangeText = comment.rangeText ? `"${comment.rangeText}"` : "Selected text";
                    item.textContent = `${rangeText}: ${comment.commentText ?? "No comment text provided."}`;
                    commentList.appendChild(item);
                });
            }
            applyButton.disabled = false;
            setStatus("Model response received. Review and apply if desired.");
        } catch (error) {
            previewInput.value = "";
            applyButton.disabled = true;
            setStatus(error.message || "Unable to reach model endpoint.", true);
        }
    }

    async function applyReplacement() {
        const previewInput = document.getElementById("previewInput");
        const replacementText = previewInput.value;
        const suggestComments = document.getElementById("suggestCommentsToggle").checked;

        setStatus("Applying replacement to selection...");

        try {
            await Word.run(async (context) => {
                const selection = context.document.getSelection();
                selection.insertText(replacementText, Word.InsertLocation.replace);

                if (suggestComments && lastComments.length > 0) {
                    const body = context.document.body;
                    const commentTargets = [];

                    lastComments.forEach((comment) => {
                        const commentText = comment.commentText ?? "";
                        if (!commentText.trim()) {
                            return;
                        }

                        if (comment.rangeText) {
                            const results = body.search(comment.rangeText, {
                                matchCase: false,
                                matchWholeWord: false,
                            });
                            results.load("items");
                            commentTargets.push({ results, commentText });
                        } else {
                            commentTargets.push({ results: null, commentText });
                        }
                    });

                    await context.sync();

                    const fallbackRange = context.document.getSelection();
                    commentTargets.forEach(({ results, commentText }) => {
                        const targetRange =
                            results && results.items.length > 0 ? results.items[0] : fallbackRange;
                        targetRange.insertComment(commentText);
                    });
                }

                await context.sync();
            });

            setStatus("Replacement applied.");
        } catch (error) {
            setStatus(error.message || "Unable to apply replacement.");
        }
    }

    function resetPreview() {
        document.getElementById("previewInput").value = "";
        document.getElementById("lawSummaryInput").value = "";
        document.getElementById("lawTextInput").value = "";
        document.getElementById("commentList").innerHTML = "";
        lastComments = [];
        document.getElementById("applyButton").disabled = true;
        setStatus("Preview cleared.");
    }
</script>

</html>
