<!DOCTYPE html>
<html>

<head>
    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-top: 12px;
        }

        textarea,
        input[type="text"] {
            width: 100%;
            margin-top: 6px;
            padding: 8px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .button-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        button {
            padding: 6px 12px;
        }

        .readonly {
            background-color: #f5f5f5;
        }
    </style>
</head>

<body>
    <label for="questionInput">Ask a question</label>
    <textarea id="questionInput" placeholder="Ask about the current selection..."></textarea>

    <label for="selectionContext">Current selection</label>
    <textarea id="selectionContext" class="readonly" readonly
        placeholder="Select text in the document to see it here."></textarea>

    <label for="responsePreview">Response preview</label>
    <textarea id="responsePreview" class="readonly" readonly
        placeholder="Proposed replacement text will appear here."></textarea>

    <div class="button-row">
        <button id="sendButton">Send</button>
        <button id="editButton" hidden>Edit</button>
        <button id="acceptButton" hidden>Accept</button>
        <button id="cancelButton" hidden>Cancel</button>
    </div>

    <!-- The following image URL tracks diagnostic data for this sample add-in. Please remove the image tag if you reuse this sample in your own code project. -->
    <img src="https://pnptelemetry.azurewebsites.net/pnp-officeaddins/samples/word-add-in-hello-world-run" />
</body>

<script>
    Office.onReady((info) => {
        if (info.host === Office.HostType.Word) {
            document.getElementById("sendButton").onclick = sendRequest;
            document.getElementById("editButton").onclick = enterEditMode;
            document.getElementById("acceptButton").onclick = applyReplacement;
            document.getElementById("cancelButton").onclick = cancelPreview;
        }
    });

    const questionInput = document.getElementById("questionInput");
    const selectionContext = document.getElementById("selectionContext");
    const responsePreview = document.getElementById("responsePreview");
    const sendButton = document.getElementById("sendButton");
    const editButton = document.getElementById("editButton");
    const acceptButton = document.getElementById("acceptButton");
    const cancelButton = document.getElementById("cancelButton");

    function setPreviewState({ showPreview, editable }) {
        responsePreview.readOnly = !editable;
        responsePreview.classList.toggle("readonly", !editable);
        editButton.hidden = !showPreview;
        acceptButton.hidden = !showPreview;
        cancelButton.hidden = !showPreview;
        sendButton.hidden = showPreview;
    }

    function sendRequest() {
        return Word.run(async (context) => {
            const selection = context.document.getSelection();
            selection.load("text");
            await context.sync();

            selectionContext.value = selection.text || "(No text selected.)";
            responsePreview.value = selection.text
                ? `Suggested update for: "${questionInput.value || "your request"}"\n\n${selection.text}`
                : "Select some text to generate a response preview.";

            setPreviewState({ showPreview: true, editable: false });
        });
    }

    function enterEditMode() {
        responsePreview.focus();
        setPreviewState({ showPreview: true, editable: true });
    }

    function applyReplacement() {
        return Word.run(async (context) => {
            const selection = context.document.getSelection();
            selection.insertText(responsePreview.value, Word.InsertLocation.replace);
            await context.sync();

            resetPreview();
        });
    }

    function cancelPreview() {
        resetPreview();
    }

    function resetPreview() {
        responsePreview.value = "";
        responsePreview.readOnly = true;
        responsePreview.classList.add("readonly");
        setPreviewState({ showPreview: false, editable: false });
    }
</script>

</html>
